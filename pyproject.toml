[project]
name = "cauce-oposiciones"
version = "0.1.0"
description = "Aula de preparación de oposiciones TIC con FastAPI y Svelte"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.2",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "pypdf>=6.21.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
cauce-oposiciones = "cauce_oposiciones:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
